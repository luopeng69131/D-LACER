[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlacer"
version = "0.1.0"
description = "Delayed Latent-State Adaptive Conditional Risk Control for multi-step throughput forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "D-LACER Authors"},
]
keywords = [
  "Starlink",
  "safe forecasting",
  "conditional risk control",
  "delayed feedback",
  "time-series forecasting",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=3.0",
]

[project.urls]
Homepage = "https://github.com/luopeng69131/D-LACER"
Repository = "https://github.com/luopeng69131/D-LACER"
Paper = "https://arxiv.org/abs/2605.09508"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
